use_default_settings: true
general:
  instance_name: local-searxng
  enable_metrics: false
search:
  formats: [html, json]
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  # Overridden by the SEARXNG_SECRET env var in compose.
  secret_key: "overridden-by-env"
outgoing:
  request_timeout: 6.0
